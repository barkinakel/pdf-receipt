[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-receipt"
version = "0.1.0"
description = "Local, offline PDF to Markdown conversion with an honest two-stage quality report."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "barkinakel", email = "barkinakel@gmail.com" }]
keywords = ["pdf", "markdown", "docling", "document-conversion", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["docling==2.124.0", "markdown-it-py>=4.2,<5"]

[project.urls]
Homepage = "https://github.com/barkinakel/pdf-receipt"
Documentation = "https://github.com/barkinakel/pdf-receipt/blob/main/README.md"

[project.scripts]
pdf-receipt = "pdf_receipt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
